<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>单ASIN市场分析网页版</title>
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      :root{
        --bg:#f4f6f5; --surface:#ffffff; --surface2:#edf1ef; --ink:#16211d; --ink2:#43534c;
        --line:#d5ddd9; --accent:#0d6e5f; --accent-ink:#ffffff;
        --good:#0d6e5f; --warn:#a05c00; --bad:#b3362b; --good-bg:#e2f2ec; --warn-bg:#fbf0da; --bad-bg:#fbe7e4;
        --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#101613; --surface:#182019; --surface2:#1f2a22;
          --ink:#e9efec; --ink2:#a7b5ad; --line:#2e3d34; --accent:#2fae97; --accent-ink:#0b1512;
          --good:#3ec9ab; --warn:#e8a94e; --bad:#ef7d6e; --good-bg:#17352c; --warn-bg:#3a2c12; --bad-bg:#3c1f1b;
        }
      }
      *{box-sizing:border-box}
      body{margin:0;background:var(--bg);color:var(--ink);
        font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
        font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
      .wrap{max-width:1060px;margin:0 auto;padding:20px 16px 56px}
      .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
      h1{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(24px,4.5vw,32px);line-height:1.25;margin:0;font-weight:700}
      h2{font-size:17px;margin:0 0 10px}
      h3{font-size:14px;margin:0 0 6px}
      .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
      label{display:block;font-size:13px;color:var(--ink2);margin-bottom:5px;font-weight:600}
      input[type=text],input[type=password],select{width:100%;padding:8px 10px;border:1px solid var(--line);
        border-radius:7px;background:var(--surface);color:var(--ink);font-size:15px;font-family:inherit}
      input.mono{font-family:var(--mono);font-size:13px}
      .row{display:flex;gap:10px;flex-wrap:wrap}
      .row>*{flex:1 1 160px}
      .btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
        border-radius:7px;padding:8px 18px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;min-height:40px}
      .btn:disabled{opacity:.55;cursor:wait}
      .btn.ghost{background:transparent;color:var(--accent)}
      .btn.small{padding:5px 12px;font-size:13px;min-height:36px}
      .btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
      .hint{font-size:12.5px;color:var(--ink2);margin-top:8px}
      .tokstatus{font-size:13px;margin-top:8px;min-height:1.2em}
      .ok{color:var(--good)} .err{color:var(--bad)} .wrn{color:var(--warn)}
      .steps{list-style:none;margin:12px 0 0;padding:0;font-size:13.5px}
      .steps li{padding:4px 0 4px 26px;position:relative;color:var(--ink2)}
      .steps li::before{content:"";position:absolute;left:2px;top:9px;width:11px;height:11px;border-radius:50%;
        border:2px solid var(--line);background:var(--surface)}
      .steps li.run{color:var(--ink)} .steps li.run::before{border-color:var(--accent);background:var(--accent)}
      .steps li.done{color:var(--ink2)} .steps li.done::before{border-color:var(--good);background:var(--good)}
      .steps li.fail{color:var(--bad)} .steps li.fail::before{border-color:var(--bad);background:var(--bad)}
      .banner{border-radius:8px;padding:12px 14px;font-size:14px;margin-bottom:14px;display:none}
      .banner.show{display:block}
      .banner.error{background:var(--bad-bg);border:1px solid var(--bad);color:var(--ink)}
      .banner.error b{color:var(--bad)}
      .verdict{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
      .gauge{flex:0 0 auto;text-align:center}
      .gauge .num{font-family:var(--mono);font-size:44px;font-weight:700;line-height:1}
      .gauge .of{color:var(--ink2);font-size:12px}
      .vtag{display:inline-block;padding:4px 14px;border-radius:999px;font-weight:700;font-size:16px}
      .vtag.g{background:var(--good-bg);color:var(--good)} .vtag.w{background:var(--warn-bg);color:var(--warn)} .vtag.b{background:var(--bad-bg);color:var(--bad)}
      .vdesc{color:var(--ink2);max-width:34em;margin-top:6px}
      .meta{font-size:12.5px;color:var(--ink2)}
      .meta a{color:var(--accent)}
      .dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:14px}
      .dim{background:var(--surface2);border-radius:8px;padding:10px 12px}
      .dim .top{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
      .dim .pts{font-family:var(--mono)}
      .bar{height:7px;background:var(--line);border-radius:99px;margin-top:7px;overflow:hidden}
      .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
      .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
      @media (max-width:760px){.grid2{grid-template-columns:1fr}}
      .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14px}
      .kv dt{color:var(--ink2)} .kv dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
      .tblwrap{overflow-x:auto}
      table{width:100%;border-collapse:collapse;font-size:13.5px}
      th{text-align:left;color:var(--ink2);font-weight:600;padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
      td{padding:6px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
      td.num,th.num{text-align:right}
      .kw{font-weight:600;word-break:break-word}
      .zh{color:var(--ink2);font-size:12px}
      .self td{background:var(--good-bg)}
      ul.sig,ul.risk{margin:4px 0 0;padding-left:20px;font-size:14px}
      ul.sig li::marker{color:var(--good)} ul.risk li::marker{color:var(--bad)}
      details{margin-top:10px}
      summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--accent);padding:6px 0}
      .scoreitem{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
      .scoreitem span:last-child{font-family:var(--mono);white-space:nowrap}
      .hist{display:flex;flex-direction:column;gap:8px}
      .hrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--surface);flex-wrap:wrap}
      .hrow .grow{flex:1 1 auto;min-width:140px}
      .hrow .score{font-family:var(--mono);font-weight:700;font-size:18px}
      .pill{font-size:12px;padding:2px 9px;border-radius:999px;font-weight:700}
      .pill.g{background:var(--good-bg);color:var(--good)} .pill.w{background:var(--warn-bg);color:var(--warn)} .pill.b{background:var(--bad-bg);color:var(--bad)}
      .chart{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:8px}
      .col{flex:1;text-align:center}
      .col .b{background:var(--accent);border-radius:4px 4px 0 0;margin:0 auto;width:70%;min-height:2px}
      .col .v{font-family:var(--mono);font-size:12px}
      .col .m{font-size:11.5px;color:var(--ink2)}
      .hidden{display:none!important}
      /* 连接设置弹窗 */
      .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto}
      .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5)}
      .modal-panel{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;
        width:100%;max-width:560px;padding:18px;margin-top:4vh;box-shadow:0 12px 40px rgba(0,0,0,.25)}
      .modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
      .modal-head h2{margin:0}
      .field{margin-bottom:14px}
      .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    </style>
  </head>
  <body>
    <main class="wrap">
      <header class="topbar">
        <h1>单 ASIN 市场分析</h1>
        <button class="btn ghost small" id="openConn" type="button">连接设置</button>
      </header>

      <section class="card" aria-labelledby="an-h">
        <h2 id="an-h" class="hidden">输入 ASIN 开始分析</h2>
        <div class="row">
          <div style="flex:2 1 200px">
            <label for="asin">ASIN</label>
            <input type="text" id="asin" class="mono" placeholder="输入 10 位 ASIN" maxlength="10" autocomplete="off" />
          </div>
          <div>
            <label for="site">站点</label>
            <select id="site">
              <option value="IT">意大利 IT</option><option value="DE">德国 DE</option>
              <option value="FR">法国 FR</option><option value="ES">西班牙 ES</option>
              <option value="UK">英国 UK</option><option value="US">美国 US</option>
              <option value="CA">加拿大 CA</option><option value="MX">墨西哥 MX</option>
              <option value="BR">巴西 BR</option><option value="JP">日本 JP</option>
              <option value="AE">阿联酋 AE</option><option value="AU">澳大利亚 AU</option>
              <option value="SA">沙特 SA</option>
            </select>
          </div>
          <div style="flex:0 0 auto;display:flex;align-items:flex-end">
            <button class="btn" id="go" type="button">开始分析</button>
          </div>
        </div>
        <ul class="steps hidden" id="steps">
          <li data-step="quota">检查账户额度</li>
          <li data-step="info">产品信息</li>
          <li data-step="traffic">近 7 天流量</li>
          <li data-step="keywords">反查关键词</li>
          <li data-step="orders">近 6 个月订单</li>
          <li data-step="kwinfo">主关键词需求</li>
          <li data-step="kwasin">主关键词竞品</li>
        </ul>
      </section>

      <div class="banner error" id="banner" role="alert"></div>

      <section id="reportZone"></section>

      <section class="card" aria-labelledby="hist-h">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px">
          <h2 id="hist-h" style="margin:0">分析历史</h2>
          <button class="btn small danger" id="clearHist" type="button">清空全部记录</button>
        </div>
        <div class="hist" id="hist"></div>
      </section>
    </main>

    <div class="modal hidden" id="connModal" role="dialog" aria-modal="true" aria-labelledby="conn-h">
      <div class="modal-backdrop" data-close="1"></div>
      <div class="modal-panel">
        <div class="modal-head">
          <h2 id="conn-h">连接设置</h2>
          <button class="btn small ghost" id="closeConn" type="button">关闭</button>
        </div>
        <div class="field">
          <label for="token">西柚 MCP Token</label>
          <input type="password" id="token" class="mono" autocomplete="off" placeholder="粘贴你的 MCP Token" />
          <div class="btnrow">
            <button class="btn small" id="saveTok" type="button">保存</button>
            <button class="btn small ghost" id="testTok" type="button">测试连接</button>
            <button class="btn small danger" id="clearTok" type="button">清除</button>
          </div>
          <p class="hint" id="tokFingerprint" style="font-family:var(--mono);word-break:break-all"></p>
          <p class="tokstatus" id="tokStatus" role="status"></p>
        </div>
        <div class="field">
          <label for="connMode">连接通道</label>
          <select id="connMode">
            <option value="vercel" selected>Vercel 同源中转 /api/mcp（默认）</option>
            <option value="auto">自动（依次尝试各通道）</option>
            <option value="custom">Supabase 中转地址（备选）</option>
            <option value="direct">直连西柚</option>
          </select>
        </div>
        <div id="customProxyBox">
          <div class="field">
            <label for="customProxy">中转地址（备选通道用）</label>
            <input type="text" id="customProxy" class="mono" value="https://gonejrbysfkfibqailpm.supabase.co/functions/v1/xydc-proxy" placeholder="https://你的项目.supabase.co/functions/v1/xydc-proxy" autocomplete="off" />
            <p class="hint">已预填备选 Supabase 中转地址，选备选通道时直接用，不用再找。</p>
          </div>
          <div class="field">
            <label for="sbKey">Supabase Publishable Key（备选通道用）</label>
            <input type="text" id="sbKey" class="mono" value="sb_publishable****-Sfx" placeholder="sb_publishable_… 或 eyJ… 开头" autocomplete="off" />
            <p class="hint">已预填，显示已遮蔽；实际发送时用完整值。如需更换，清空后粘贴新 Key 再保存。</p>
          </div>
        </div>
        <div class="btnrow">
          <button class="btn small" id="saveConn" type="button">保存设置</button>
          <button class="btn small ghost" id="diagBtn" type="button">诊断连接</button>
        </div>
        <p class="tokstatus" id="diagStatus" role="status"></p>
        <div id="diagList" class="hidden" style="font-size:13px;margin-top:4px"></div>
      </div>
    </div>

    <script>
    "use strict";
    var MCP_URL = "https://mcp.xydc.com/mcp";
    var LS_KEY = "xydc_mcp_token";
    var LS_REPORTS_KEY = "asin_analysis_reports_v1";
    var LS_CURRENT_KEY = "asin_analysis_current_v1";
    var $ = function(id){ return document.getElementById(id); };
    var reports = [];
    var currentId = null;

    /* ---------- Token 清洗 ---------- */
    function normalizeTokenString(raw){
      if (raw === null || raw === undefined) return "";
      var s = String(raw);
      s = s.replace(/[​-‍﻿]/g, "");
      s = s.trim();
      s = s.replace(/^["'`“”‘’]+/, "").replace(/["'`“”‘’]+$/, "").trim();
      var guard = 0;
      while (guard < 5){
        var m = s.match(/^bearer\s*:\s*/i) || s.match(/^bearer\s+/i);
        if (!m) break;
        s = s.slice(m[0].length).trim();
        guard++;
      }
      s = s.replace(/\s+/g, "");
      s = s.replace(/^["'`]+/, "").replace(/["'`]+$/, "");
      return s;
    }
    function normalizeSbKeyString(raw){
      if (raw === null || raw === undefined) return "";
      var s = String(raw).replace(/[​-‍﻿]/g, "").trim();
      s = s.replace(/^["'`]+/, "").replace(/["'`]+$/, "").trim();
      var guard = 0;
      while (guard < 5){
        var m = s.match(/^bearer\s*:\s*/i) || s.match(/^bearer\s+/i);
        if (!m) break;
        s = s.slice(m[0].length).trim(); guard++;
      }
      s = s.replace(/\s+/g, "");
      return s;
    }
    function tokenFingerprint(normalized){
      var t = normalized || "";
      if (!t) return "Token：未填";
      var head = t.slice(0, 4), tail = t.length > 4 ? t.slice(-4) : "";
      return "Token 指纹：长度 " + t.length + " · " + head + "…" + tail;
    }
    function renderTokFingerprint(){
      var el = $("tokFingerprint"); if (!el) return;
      var raw = $("token") ? ($("token").value || "") : "";
      var norm = normalizeTokenString(raw) || normalizeTokenString(loadTokenRaw());
      el.textContent = norm ? tokenFingerprint(norm) : "";
    }
    function loadTokenRaw(){ try { return localStorage.getItem(LS_KEY) || ""; } catch(e){ return ""; } }
    function loadToken(){ return normalizeTokenString(loadTokenRaw()); }
    function storeToken(t){ var n = normalizeTokenString(t); try { if(n) localStorage.setItem(LS_KEY, n); else localStorage.removeItem(LS_KEY); } catch(e){} return n; }
    function getToken(){
      var raw = $("token") ? ($("token").value || "") : "";
      var n = normalizeTokenString(raw);
      if (n) return n;
      return loadToken();
    }
    function getTokenRawForNote(){ return $("token") ? ($("token").value || "") : ""; }

    /* ---------- 历史报告本机保存 ---------- */
    function loadReports(){
      try {
        var raw = localStorage.getItem(LS_REPORTS_KEY);
        if (!raw) return [];
        var arr = JSON.parse(raw);
        if (!Array.isArray(arr)) return [];
        return arr.filter(function(r){ return r && r.id && r.asin; });
      } catch(e){ return []; }
    }
    function loadCurrentId(){
      try { return localStorage.getItem(LS_CURRENT_KEY) || null; } catch(e){ return null; }
    }
    function saveReports(){
      try {
        if (reports.length) localStorage.setItem(LS_REPORTS_KEY, JSON.stringify(reports));
        else localStorage.removeItem(LS_REPORTS_KEY);
        if (currentId) localStorage.setItem(LS_CURRENT_KEY, currentId);
        else localStorage.removeItem(LS_CURRENT_KEY);
      } catch(e){}
    }
    function clearSavedReports(){
      try { localStorage.removeItem(LS_REPORTS_KEY); localStorage.removeItem(LS_CURRENT_KEY); } catch(e){}
    }

    /* ---------- 连接通道 ---------- */
    var LS_MODE_KEY = "xydc_conn_mode_v2";
    var LS_PROXY_KEY = "xydc_custom_proxy";
    var LS_SB_KEY = "xydc_sb_anon_key";
    var DEFAULT_PROXY_URL = "https://gonejrbysfkfibqailpm.supabase.co/functions/v1/xydc-proxy";
    var DEFAULT_SB_KEY = "sb_publishable_LBS5Sxcvczv9tM-RWHPOrg_bJZ1-Sfx";
    var OLD_WRONG_SB_KEY = "sb_publishable_LBSSSxcvcvz9tM-RWHPOrg_bJZ1-Sfx";
    var realSbKey = "";
    function sbKeyDetailFingerprint(k){
      var s = String(k || "");
      if (!s) return "";
      return s.length + "|" + s.slice(0, 24) + "|" + s.slice(-4);
    }
    function resolveStoredSbKey(storedRaw){
      var stored = normalizeSbKeyString(storedRaw || "");
      if (!stored) return DEFAULT_SB_KEY;
      if (stored === OLD_WRONG_SB_KEY) return DEFAULT_SB_KEY;
      if (sbKeyDetailFingerprint(stored) !== sbKeyDetailFingerprint(DEFAULT_SB_KEY)) return DEFAULT_SB_KEY;
      return stored;
    }
    function migrateStoredSbKey(){
      try {
        var raw = localStorage.getItem(LS_SB_KEY);
        if (raw === null || raw === undefined) return DEFAULT_SB_KEY;
        var resolved = resolveStoredSbKey(raw);
        if (normalizeSbKeyString(raw) !== resolved){
          try { localStorage.setItem(LS_SB_KEY, resolved); } catch(e){}
        }
        return resolved;
      } catch(e){ return DEFAULT_SB_KEY; }
    }
    function maskSecret(v){
      var s = String(v || "");
      if (!s) return "";
      if (s.length <= 10) return "****";
      return s.slice(0, 14) + "****" + s.slice(-4);
    }
    function isMaskedValue(v){ return !!v && String(v).indexOf("****") >= 0; }
    function getVercelUrl(){ return "/api/mcp"; }
    function getConnMode(){ var v = ($("connMode") && $("connMode").value) || ""; if (!v){ try { v = localStorage.getItem(LS_MODE_KEY) || "vercel"; } catch(e){ v = "vercel"; } } if (v !== "direct" && v !== "custom" && v !== "auto" && v !== "vercel") v = "vercel"; return v; }
    function getCustomProxy(){
      var v = ($("customProxy") && $("customProxy").value || "").replace(/\s+/g, "");
      if (v) return v;
      try { var s = (localStorage.getItem(LS_PROXY_KEY) || "").replace(/\s+/g, ""); if (s) return s; } catch(e){}
      return DEFAULT_PROXY_URL;
    }
    function getSbKey(){
      var el = $("sbKey");
      var raw = el ? String(el.value || "").trim() : "";
      if (raw && !isMaskedValue(raw)){
        var n = normalizeSbKeyString(raw);
        if (n){
          if (n === OLD_WRONG_SB_KEY){ realSbKey = DEFAULT_SB_KEY; return DEFAULT_SB_KEY; }
          realSbKey = n; return n;
        }
      }
      if (realSbKey && realSbKey !== OLD_WRONG_SB_KEY) return realSbKey;
      var resolved = migrateStoredSbKey();
      realSbKey = resolved;
      return resolved;
    }
    function showMaskedSbKey(){
      var el = $("sbKey"); if (!el) return;
      var k = getSbKey();
      el.value = maskSecret(k);
    }
    function sbKeyFingerprint(){ var k = getSbKey(); if (!k) return "Publishable Key：未填"; return "Publishable Key 指纹：长度 " + k.length + " · " + k.slice(0, 6) + "…" + (k.length > 6 ? k.slice(-4) : ""); }
    function isSupabaseProxyUrl(u){ return !!u && u.indexOf(".supabase.co/functions/") >= 0; }
    function resolveCustomUrl(){
      var c = getCustomProxy(); if (!c) return null;
      if (c.indexOf("{url}") >= 0) return c.split("{url}").join(encodeURIComponent(MCP_URL));
      return c;
    }
    function getRoutes(){
      var mode = getConnMode();
      var vercel = { id:"vercel", label:"Vercel 同源中转 /api/mcp", url:getVercelUrl() };
      var direct = { id:"direct", label:"直连 mcp.xydc.com", url:MCP_URL };
      var cu = resolveCustomUrl();
      var custom = cu ? { id:"custom", label:"Supabase 中转（备选）", url:cu } : null;
      if (mode === "vercel") return [vercel];
      if (mode === "direct") return [direct];
      if (mode === "custom") return custom ? [custom] : [];
      var out = [vercel];
      if (custom) out.push(custom);
      out.push(direct);
      return out;
    }
    function saveConnSettings(){
      try { localStorage.setItem(LS_MODE_KEY, getConnMode()); } catch(e){}
      var px = $("customProxy"); if (px){ var v = (px.value || "").replace(/\s+/g, ""); if (!v) v = DEFAULT_PROXY_URL; px.value = v; try { localStorage.setItem(LS_PROXY_KEY, v); } catch(e){} }
      var sb = $("sbKey"); if (sb){ var k = getSbKey(); realSbKey = k; try { if (k) localStorage.setItem(LS_SB_KEY, k); } catch(e){} sb.value = maskSecret(k); }
    }

    /* ---------- MCP 客户端 ---------- */
    function McpError(kind, msg){ this.kind = kind; this.message = msg; }
    function newSession(){ return { id:null, seq:0, protocol:"2025-11-25", routeUrl:null, routeLabel:"", routeId:"" }; }
    function isSupabaseGatewayBody(text){
      if (!text) return false;
      var t = String(text);
      return t.indexOf("UNAUTHORIZED_NO_AUTH_HEADER") >= 0 || t.indexOf("UNAUTHORIZED_INVALID_TOKEN") >= 0 ||
        t.indexOf("Invalid JWT") >= 0 || t.indexOf("invalid JWT") >= 0 ||
        t.indexOf("Missing authorization header") >= 0 || t.indexOf("missing authorization") >= 0 ||
        t.indexOf("No API key found") >= 0 || t.indexOf("JWSError") >= 0;
    }
    function snippetOf(text){ var t = String(text || "").replace(/\s+/g, " ").trim(); return t.length > 220 ? t.slice(0, 220) + "…" : t; }
    function parseMcpBody(text, contentType, wantId){
      if (contentType && contentType.indexOf("text/event-stream") >= 0){
        var lines = text.split(/\r?\n/), datas = [], found = null;
        for (var i=0;i<lines.length;i++){
          var ln = lines[i];
          if (ln.indexOf("data:") === 0){ datas.push(ln.slice(5).trim()); }
          else if (ln === "" && datas.length){
            try { var m = JSON.parse(datas.join("\n")); if (m && m.id === wantId) found = m; } catch(e){}
            datas = [];
          }
        }
        if (datas.length){ try { var m2 = JSON.parse(datas.join("\n")); if (m2 && m2.id === wantId) found = m2; } catch(e){} }
        return found;
      }
      try { return JSON.parse(text); } catch(e){ return null; }
    }
    async function readMcpStream(resp, wantId){
      var contentType = resp.headers.get("Content-Type") || "";
      var isSse = contentType.indexOf("text/event-stream") >= 0;
      if (!resp.body || typeof resp.body.getReader !== "function"){
        var fallbackText = await resp.text();
        return parseMcpBody(fallbackText, contentType, wantId);
      }
      var reader = resp.body.getReader();
      var decoder = new TextDecoder("utf-8");
      var buffer = "";
      var fullText = "";
      var dataLines = [];
      function tryParseDataLines(){
        if (!dataLines.length) return null;
        try {
          var m = JSON.parse(dataLines.join("\n"));
          if (m && m.id === wantId) return m;
        } catch(e){}
        return null;
      }
      try {
        while (true){
          var chunk = await reader.read();
          if (chunk.done) break;
          var piece = decoder.decode(chunk.value, { stream:true });
          if (!piece) continue;
          fullText += piece;
          buffer += piece;
          var nl;
          while ((nl = buffer.indexOf("\n")) >= 0){
            var line = buffer.slice(0, nl).replace(/\r$/, "");
            buffer = buffer.slice(nl + 1);
            if (isSse || line.indexOf("data:") === 0 || dataLines.length){
              if (line.indexOf("data:") === 0){
                dataLines.push(line.slice(5).trim());
              } else if (line === ""){
                var hit = tryParseDataLines();
                dataLines = [];
                if (hit){
                  try { await reader.cancel(); } catch(e){}
                  return hit;
                }
              }
            }
          }
          if (dataLines.length){
            var hit2 = tryParseDataLines();
            if (hit2){
              try { await reader.cancel(); } catch(e){}
              return hit2;
            }
          }
          if (!isSse){
            try {
              var mj = JSON.parse(fullText);
              if (mj && mj.id === wantId){
                try { await reader.cancel(); } catch(e){}
                return mj;
              }
            } catch(e){}
          }
        }
      } finally {
        try { reader.releaseLock(); } catch(e){}
      }
      if (buffer){
        var lastLine = buffer.replace(/\r$/, "");
        if (lastLine.indexOf("data:") === 0) dataLines.push(lastLine.slice(5).trim());
      }
      var tailHit = tryParseDataLines();
      if (tailHit) return tailHit;
      return parseMcpBody(fullText, contentType, wantId);
    }
    async function readErrorText(resp){
      try {
        if (!resp.body || typeof resp.body.getReader !== "function") return await resp.text();
        var reader = resp.body.getReader();
        var decoder = new TextDecoder("utf-8");
        var out = "";
        while (out.length < 4000){
          var chunk = await reader.read();
          if (chunk.done) break;
          out += decoder.decode(chunk.value, { stream:true });
        }
        try { await reader.cancel(); } catch(e){}
        try { reader.releaseLock(); } catch(e){}
        return out;
      } catch(e){ return ""; }
    }
    async function mcpSend(session, token, method, params, isNotification, timeoutMs){
      token = normalizeTokenString(token);
      session.seq += 1;
      var id = isNotification ? null : session.seq;
      var body = { jsonrpc:"2.0", method:method, params:params || {} };
      if (id !== null) body.id = id;
      var targetUrl = session.routeUrl || MCP_URL;
      var isVercel = session.routeId === "vercel";
      var isCustom = session.routeId === "custom" || (!isVercel && !!targetUrl && targetUrl !== MCP_URL);
      var sbKey = (isCustom && isSupabaseProxyUrl(targetUrl)) ? normalizeSbKeyString(getSbKey()) : "";
      var useDual = !!(isCustom && sbKey);
      var headers = {
        "Content-Type":"application/json",
        "Accept":"application/json, text/event-stream",
        "MCP-Protocol-Version": session.protocol
      };
      if (useDual){
        headers["Authorization"] = "Bearer " + sbKey;
        headers["apikey"] = sbKey;
        headers["X-Xydc-Authorization"] = "Bearer " + token;
      } else {
        headers["Authorization"] = "Bearer " + token;
      }
      if (session.id) headers["Mcp-Session-Id"] = session.id;
      var ctrl = new AbortController();
      var limit = timeoutMs || 90000;
      var timer = setTimeout(function(){ ctrl.abort(); }, limit);
      var resp;
      try {
        resp = await fetch(targetUrl, { method:"POST", headers:headers, body:JSON.stringify(body), signal:ctrl.signal });
      } catch(e) {
        clearTimeout(timer);
        if (e && e.name === "AbortError") throw new McpError("timeout", "请求超时（" + Math.round(limit/1000) + " 秒），通道「" + (session.routeLabel || "直连") + "」未响应。");
        throw new McpError("network", "通道「" + (session.routeLabel || "直连") + "」连不上：网络不通或被拦截，未拿到数据。");
      }
      var sid = resp.headers.get("Mcp-Session-Id");
      if (sid) session.id = sid;
      var respText = "";
      if (!resp.ok || resp.status === 401 || resp.status === 403){
        try { respText = await readErrorText(resp); } catch(e){ respText = ""; }
        clearTimeout(timer);
      }
      if (isVercel && resp.status === 404){
        throw new McpError("vercel-missing", "Vercel 同源中转未部署：/api/mcp 返回 404，请确认仓库已添加 api/mcp.js 并部署完成。");
      }
      if (resp.status === 401 || resp.status === 403){
        if (isCustom && isSupabaseGatewayBody(respText)){
          throw new McpError("proxy-jwt", "Supabase 中转返回 " + resp.status + "：网关拦截了请求，请检查 Publishable Key 是否填写正确。");
        }
        throw new McpError("auth", "西柚返回 " + resp.status + "：Token 未被接受（" + tokenFingerprint(token) + "），请在连接设置中核对 Token。");
      }
      if (resp.status === 429){
        clearTimeout(timer);
        try { if (resp.body) resp.body.cancel(); } catch(e){}
        throw new McpError("quota", "接口返回 429：额度或频率已达上限，稍后再试。");
      }
      if (isNotification){
        clearTimeout(timer);
        try { if (resp.body) resp.body.cancel(); } catch(e){}
        if (resp.status === 202 || resp.ok) return null;
        throw new McpError("proto", "MCP 初始化通知未被接受（HTTP " + resp.status + "）。");
      }
      if (!resp.ok){
        clearTimeout(timer);
        if (!respText){ try { respText = await readErrorText(resp); } catch(e){ respText = ""; } }
        throw new McpError("http", "接口返回 HTTP " + resp.status + "，本次调用失败。" + (respText ? "返回：" + snippetOf(respText) : ""));
      }
      var msg;
      try {
        msg = await readMcpStream(resp, id);
      } catch(e) {
        clearTimeout(timer);
        if (e && e.name === "AbortError") throw new McpError("timeout", "请求超时：已连上通道「" + (session.routeLabel || "直连") + "」，但未等到返回，请确认中转是流式透传版后重试。");
        throw new McpError("proto", "读取返回失败：" + (e && e.message ? e.message : e));
      }
      clearTimeout(timer);
      if (!msg) throw new McpError("proto", "返回中没有找到对应的 MCP 响应，本次没有拿到数据。");
      if (msg.error) throw new McpError("rpc", "西柚接口报错：" + ((msg.error && msg.error.message) || "未知错误"));
      return msg.result;
    }
    async function mcpInitOnRoute(session, token, route){
      session.routeUrl = route.url; session.routeLabel = route.label; session.routeId = route.id;
      var r = await mcpSend(session, token, "initialize", {
        protocolVersion: session.protocol, capabilities:{},
        clientInfo:{ name:"asin-market-web", version:"1" }
      }, false, 25000);
      if (r && r.protocolVersion) session.protocol = r.protocolVersion;
      await mcpSend(session, token, "notifications/initialized", {}, true, 25000);
    }
    async function mcpInit(session, token, onTry){
      var routes = getRoutes();
      var mode = getConnMode();
      if (mode === "custom" && !getCustomProxy()){
        throw new McpError("config", "已选 Supabase 中转但未填中转地址，请在连接设置中填写，或改回默认通道。");
      }
      var errors = [];
      for (var i=0;i<routes.length;i++){
        var route = routes[i];
        if (onTry) onTry(route, i, routes.length);
        var trial = newSession();
        try {
          await mcpInitOnRoute(trial, token, route);
          session.id = trial.id; session.seq = trial.seq; session.protocol = trial.protocol;
          session.routeUrl = trial.routeUrl; session.routeLabel = trial.routeLabel; session.routeId = trial.routeId;
          return route;
        } catch(e){
          errors.push(route.label + "：" + (e.message || e));
          if (e && (e.kind === "auth" || e.kind === "proxy-jwt")) throw e;
        }
      }
      throw new McpError("network", "所有通道都连不上。已试：" + errors.join("；") + "。可在连接设置中点诊断查看。");
    }
    async function callTool(session, token, name, args){
      var r = await mcpSend(session, token, "tools/call", { name:name, arguments:args });
      if (!r) throw new McpError("proto", name + " 没有返回结果。");
      if (r.isError){
        var em = "";
        if (r.content) for (var i=0;i<r.content.length;i++){ if (r.content[i].type === "text") em += r.content[i].text; }
        throw new McpError("tool", name + " 调用失败：" + (em || "接口返回错误"));
      }
      if (r.structuredContent) return r.structuredContent;
      if (r.content){
        for (var j=0;j<r.content.length;j++){
          if (r.content[j].type === "text"){ try { return JSON.parse(r.content[j].text); } catch(e){} }
        }
      }
      throw new McpError("proto", name + " 返回的数据格式无法识别。");
    }

          if (li && li.className === "run") li.className = "fail";
        });
        showBanner("<b>分析失败，没有生成报告。</b>" + esc(e.message || e));
      } finally { btn.disabled = false; btn.textContent = "开始分析"; }
    });

    /* ---------- 数据归一化 ---------- */
    function rankOf(item, pos){ var rs = item.ranks || []; for (var i=0;i<rs.length;i++){ if (rs[i].position === pos) return rs[i].totalRank || null; } return null; }
    function normalize(asin, country, info, tr, kwList, kwData, mainKw, kwInfo, competitors, trends, quota){
      var kwCounts = kwData.searchTermCount || [];
      var orgCount = null, adCount = null;
      kwCounts.forEach(function(c){ if (c.type === "organic") orgCount = c.count; if (c.type === "advertising") adCount = c.count; });
      var r = {
        id: "r" + Date.now() + Math.floor(Math.random()*999),
        asin: asin, country: country, fetchedAt: new Date().toLocaleString("zh-CN"),
        info: {
          title: info.title || "", brand: info.brand || "", price: num(info.price), currency: info.currency || "",
          stars: num(info.stars), ratings: num(info.ratings), fbaFee: num(info.fbaFee),
          referralRatio: num(info.referralFeeRatio), fulfillment: info.fulfillmentType || "",
          category: (info.internalCategoryTree && info.internalCategoryTree.categoryName && info.internalCategoryTree.categoryName.translated) || "",
          streetDate: info.streetDate || "", url: info.amazonUrl || ""
        },
        traffic: {
          total: num(tr.totalTraffic), organic: num(tr.organicTraffic), ad: num(tr.advertisingTraffic),
          organicRatio: num(tr.organicTrafficRatio), growth: num(tr.totalTrafficGrowthRate),
          prevTotal: num(tr.previous7DaysTotalTraffic),
          organicTerms: orgCount !== null ? orgCount : num(tr.organicSearchTermCount),
          adTerms: adCount !== null ? adCount : num(tr.advertisingSearchTermCount)
        },
        keywords: kwList.slice(0,10).map(function(k){
          return { kw:k.searchTerm, zh:k.searchTermZh || "", traffic: num(((k.trafficSummary||{}).traffic||{}).total) || 0, or: rankOf(k,"or"), sp: rankOf(k,"sp") };
        }),
        kwTotal: kwData.total || kwList.length,
        mainKw: null, competitors: [], orders: trends.map(function(t){ return { date:t.date, orders:num(t.orders) || 0 }; }),
        quota: quota ? { plan: quota.planName || "", monthlyRemain: (quota.monthly||{}).remaining, weeklyRemain: (quota.weekly||{}).remaining } : null
      };
      if (mainKw && kwInfo){
        var aba = kwInfo.abaReport || {};
        var topSelf = null; (aba.topAsins || []).forEach(function(a){ if (a.asin === asin) topSelf = a; });
        r.mainKw = {
          term: kwInfo.searchTerm || mainKw.searchTerm, zh: kwInfo.searchTermZh || mainKw.searchTermZh || "",
          volume: num(aba.weeklySearchVolume), difficulty: num(kwInfo.competitiveDifficulty),
          tier: kwInfo.competitiveDifficultyTier || "", cpc: num((kwInfo.costPerClick||{}).value),
          clickShare: topSelf ? num(topSelf.clickShare) : null, convShare: topSelf ? num(topSelf.conversionShare) : null,
          orRank: rankOf(mainKw, "or"), traffic: num(((mainKw.trafficSummary||{}).traffic||{}).total)
        };
      } else if (mainKw) {
        r.mainKw = { term: mainKw.searchTerm, zh: mainKw.searchTermZh || "", volume:null, difficulty:null, tier:"", cpc:null, clickShare:null, convShare:null, orRank: rankOf(mainKw,"or"), traffic: num(((mainKw.trafficSummary||{}).traffic||{}).total) };
      }
      r.competitors = competitors.slice(0,10).map(function(c){
        var ai = c.asinInfo || {};
        return { asin:c.asin, price:num(ai.price), stars:num(ai.stars), ratings:num(ai.ratings), sales:num(c.sales), traffic:num(((c.trafficSummary||{}).traffic||{}).total) || 0, or: rankOf(c,"or"), self: c.asin === asin };
      });
      return r;
    }

    /* ---------- 评分：100 分制 ---------- */
    function band(v, table){
      if (v === null || v === undefined) return 0;
      for (var i=0;i<table.length;i++){ if (v >= table[i][0]) return table[i][1]; }
      return table[table.length-1][1];
    }
    function bandLow(v, table){
      if (v === null || v === undefined) return 0;
      for (var i=0;i<table.length;i++){ if (v <= table[i][0]) return table[i][1]; }
      return table[table.length-1][1];
    }
    function scoreReport(r){
      var dims = [], signals = [], risks = [];
      var d1 = [];
      var vol = r.mainKw ? r.mainKw.volume : null;
      var pVol = band(vol, [[1000,12],[500,10],[200,8],[100,6],[50,4],[20,2],[1,1],[0,0]]);
      d1.push({label:"主关键词周搜索量 " + (vol===null?"无数据":fmt(vol)), pts:pVol, max:12});
      var pTraf = band(r.traffic.total, [[5000,8],[2000,7],[1000,6],[500,5],[200,3],[50,2],[1,1],[0,0]]);
      d1.push({label:"近 7 天总流量 " + fmt(r.traffic.total), pts:pTraf, max:8});
      var ordTotal = r.orders.reduce(function(s,o){ return s+o.orders; }, 0);
      var pOrd = band(ordTotal, [[300,10],[150,8],[100,7],[50,5],[1,3],[0,0]]);
      d1.push({label:"近 6 个月订单合计 " + fmt(ordTotal) + "（分档估算）", pts:pOrd, max:10});
      dims.push({name:"市场需求", max:30, items:d1});
      if (vol !== null && vol >= 100) signals.push("主关键词「" + r.mainKw.term + "」周搜索量 " + fmt(vol) + "，有真实搜索需求");
      if (ordTotal >= 100) signals.push("近 6 个月订单合计约 " + fmt(ordTotal) + " 单，销量已被市场验证");
      if (r.traffic.total !== null && r.traffic.total >= 1000) signals.push("近 7 天总流量 " + fmt(r.traffic.total) + "，类目流量池不小");
      if (ordTotal === 0) risks.push("近 6 个月订单为 0，销量未经验证");
      if (vol !== null && vol < 50) risks.push("主关键词周搜索量只有 " + fmt(vol) + "，需求盘子偏小");
      var d2 = [];
      var diff = r.mainKw ? r.mainKw.difficulty : null;
      var pDiff = bandLow(diff, [[30,10],[45,8],[60,6],[70,4],[80,2],[999,1]]);
      d2.push({label:"主关键词竞争难度 " + (diff===null?"无数据":diff + (r.mainKw.tier ? "（" + r.mainKw.tier + "）" : "")), pts:pDiff, max:10});
      var headRatings = null;
      r.competitors.forEach(function(c){ if (!c.self && c.ratings !== null && (headRatings === null || c.ratings > headRatings)) headRatings = c.ratings; });
      var pHead = bandLow(headRatings, [[300,8],[1000,7],[3000,5],[8000,3],[999999999,2]]);
      d2.push({label:"头部竞品最高评论数 " + (headRatings===null?"无数据":fmt(headRatings)), pts:pHead, max:8});
      var orRank = r.mainKw ? r.mainKw.orRank : null;
      var pRank = bandLow(orRank, [[1,7],[3,6],[10,4],[20,2],[999999,1]]);
      d2.push({label:"本品在主关键词下自然排名 " + (orRank===null?"未上榜":("第 " + orRank)), pts:pRank, max:7});
      dims.push({name:"竞争强度", max:25, items:d2});
      if (diff !== null && diff <= 60) signals.push("主关键词竞争难度 " + diff + "，属于可切入区间");
      if (orRank !== null && orRank <= 3) signals.push("本品在主关键词下自然排名第 " + orRank + "，已有自然权重");
      if (r.mainKw && r.mainKw.clickShare !== null && r.mainKw.clickShare >= 0.15) signals.push("本品在主关键词下点击份额 " + pct(r.mainKw.clickShare,1) + "，转化份额 " + pct(r.mainKw.convShare,1));
      if (headRatings !== null && headRatings >= 8000) risks.push("头部竞品评论数高达 " + fmt(headRatings) + "，评论壁垒很厚，新品难追赶");
      if (diff !== null && diff > 70) risks.push("主关键词竞争难度 " + diff + "，切入成本高");
      var d3 = [];
      var prices = r.competitors.map(function(c){ return c.price; }).filter(function(p){ return p !== null; }).sort(function(a,b){ return a-b; });
      var median = prices.length ? prices[Math.floor(prices.length/2)] : null;
      var pPrice = 0, priceNote = "无竞品价格数据";
      if (median !== null && r.info.price !== null){
        var ratio = r.info.price / median;
        pPrice = ratio <= 0.9 ? 5 : ratio <= 1.1 ? 6 : ratio <= 1.3 ? 3 : 1;
        priceNote = "售价 " + money(r.info.price, r.info.currency) + "，竞品价中位数 " + money(median, r.info.currency);
      }
      d3.push({label:priceNote, pts:pPrice, max:6});
      var feeRatio = null;
      if (r.info.price && r.info.fbaFee !== null && r.info.referralRatio !== null)
        feeRatio = (r.info.fbaFee + r.info.price * r.info.referralRatio) / r.info.price;
      var pFee = bandLow(feeRatio, [[0.25,6],[0.30,5],[0.35,4],[0.40,3],[0.50,2],[9,1]]);
      d3.push({label:"平台费用占比（FBA " + money(r.info.fbaFee, r.info.currency) + " + 佣金 " + pct(r.info.referralRatio,0) + "）" + (feeRatio===null?"无数据":("合计 " + pct(feeRatio,1))), pts:pFee, max:6});
      var cpcRatio = (r.mainKw && r.mainKw.cpc !== null && r.info.price) ? r.mainKw.cpc / r.info.price : null;
      var pCpc = bandLow(cpcRatio, [[0.06,3],[0.09,2],[0.12,1],[9,0]]);
      d3.push({label:"主关键词 CPC " + (r.mainKw ? money(r.mainKw.cpc, r.info.currency) : "—") + (cpcRatio===null?"":"，占售价 " + pct(cpcRatio,1)), pts:pCpc, max:3});
      dims.push({name:"价格带与费用", max:15, items:d3});
      if (median !== null && r.info.price !== null && r.info.price < median) signals.push("售价低于竞品中位价 " + money(median, r.info.currency) + "，有价格优势");
      if (feeRatio !== null && feeRatio > 0.35) risks.push("平台费用占售价 " + pct(feeRatio,1) + "，利润空间被 FBA 费和佣金吃掉较多");
      if (cpcRatio !== null && cpcRatio > 0.09) risks.push("主关键词 CPC 占售价 " + pct(cpcRatio,1) + "，广告获客偏贵");
      var d4 = [];
      var pOrg = band(r.traffic.organicRatio, [[0.8,6],[0.7,5],[0.6,4],[0.5,3],[0.3,2],[0,1]]);
      d4.push({label:"自然流量占比 " + pct(r.traffic.organicRatio,1), pts:pOrg, max:6});
      var pGrow = band(r.traffic.growth, [[0,5],[-0.10,4],[-0.20,3],[-0.35,2],[-9,1]]);
      d4.push({label:"总流量环比 " + (r.traffic.growth===null?"—":((r.traffic.growth>=0?"+":"") + pct(r.traffic.growth,1))), pts:pGrow, max:5});
      var pKw = band(r.traffic.organicTerms, [[50,4],[30,3],[15,2],[5,1],[0,0]]);
      d4.push({label:"自然流量关键词数 " + fmt(r.traffic.organicTerms), pts:pKw, max:4});
      dims.push({name:"流量健康度", max:15, items:d4});
      if (r.traffic.organicRatio !== null && r.traffic.organicRatio >= 0.7) signals.push("自然流量占比 " + pct(r.traffic.organicRatio,1) + "，不依赖广告硬撑");
      if (r.traffic.growth !== null && r.traffic.growth < -0.10) risks.push("近 7 天总流量环比 " + pct(r.traffic.growth,1) + "，流量在下滑");
      if (r.traffic.organicRatio !== null && r.traffic.organicRatio < 0.4) risks.push("自然流量占比只有 " + pct(r.traffic.organicRatio,1) + "，流量主要靠广告买");
      var d5 = [];
      var pStars = band(r.info.stars, [[4.5,5],[4.3,4],[4.0,3],[3.5,2],[0,1]]);
      d5.push({label:"评分 " + (r.info.stars===null?"—":r.info.stars), pts:pStars, max:5});
      var pRev = band(r.info.ratings, [[100,5],[50,4],[20,3],[5,2],[0,1]]);
      d5.push({label:"评论数 " + fmt(r.info.ratings), pts:pRev, max:5});
      var ageMonths = null;
      if (r.info.streetDate){ var sd = new Date(r.info.streetDate); if (!isNaN(sd)) ageMonths = (Date.now() - sd.getTime()) / (30.44*24*3600*1000); }
      var pAge = band(ageMonths, [[12,5],[6,4],[3,3],[1,2],[0,1]]);
      d5.push({label:"上架时长 " + (ageMonths===null?"无数据":("约 " + ageMonths.toFixed(1) + " 个月")), pts:pAge, max:5});
      dims.push({name:"产品成熟度", max:15, items:d5});
      if (r.info.stars !== null && r.info.stars >= 4.3) signals.push("评分 " + r.info.stars + "，产品口碑达标");
      if (r.info.stars !== null && r.info.stars < 4.0) risks.push("评分只有 " + r.info.stars + "，口碑偏弱");
      if (ageMonths !== null && ageMonths < 3) risks.push("上架仅约 " + ageMonths.toFixed(1) + " 个月，数据样本还太新");
      var total = dims.reduce(function(s,d){ return s + d.items.reduce(function(a,i){ return a+i.pts; },0); }, 0);
      dims.forEach(function(d){ d.score = d.items.reduce(function(a,i){ return a+i.pts; },0); });
      var verdict = total >= 65 ? {t:"值得尝试上架", cls:"g"} : total >= 45 ? {t:"谨慎尝试", cls:"w"} : {t:"不建议上架", cls:"b"};
      return { total:total, verdict:verdict, dims:dims, signals:signals, risks:risks, ordTotal:ordTotal, median:median, feeRatio:feeRatio };
    }

    /* ---------- 渲染 ---------- */
    function verdictDesc(v){
      if (v.cls === "g") return "需求、竞争、费用和流量四项没有硬伤，可以小批量备货试上架，边卖边盯主关键词排名和流量环比。";
      if (v.cls === "w") return "有机会但有明确短板（见下方风险提示），建议先小量测试或换个切入角度，不要重仓备货。";
      return "硬伤明显：需求、竞争或费用至少一项不及格，现阶段不建议投入备货和广告。";
    }
    function renderReport(r){
      var s = scoreReport(r);
      var zone = $("reportZone");
      var dimHtml = s.dims.map(function(d){
        return '<div class="dim"><div class="top"><span>' + d.name + '</span><span class="pts">' + d.score + " / " + d.max + '</span></div>' +
          '<div class="bar"><i style="width:' + Math.round(d.score/d.max*100) + '%"></i></div></div>';
      }).join("");
      var scoreDetail = s.dims.map(function(d){
        var items = d.items.map(function(i){ return '<div class="scoreitem"><span>' + esc(i.label) + '</span><span>' + i.pts + " / " + i.max + "</span></div>"; }).join("");
        return "<h3 style='margin-top:12px'>" + d.name + "（" + d.score + " / " + d.max + "）</h3>" + items;
      }).join("");
      var kwRows = r.keywords.map(function(k){
        return "<tr><td><span class='kw'>" + esc(k.kw) + "</span>" + (k.zh ? "<div class='zh'>" + esc(k.zh) + "</div>" : "") + "</td>" +
          '<td class="num">' + fmt(k.traffic) + '</td><td class="num">' + (k.or || "—") + '</td><td class="num">' + (k.sp || "—") + "</td></tr>";
      }).join("");
      var compRows = r.competitors.map(function(c){
        return '<tr class="' + (c.self ? "self" : "") + '"><td style="font-family:var(--mono);font-size:12px">' + esc(c.asin) + (c.self ? "（本品）" : "") + "</td>" +
          '<td class="num">' + money(c.price, r.info.currency) + '</td><td class="num">' + (c.stars || "—") + '</td><td class="num">' + fmt(c.ratings) +
          '</td><td class="num">' + fmt(c.sales) + '</td><td class="num">' + (c.or || "—") + "</td></tr>";
      }).join("");
      var maxOrd = Math.max.apply(null, r.orders.map(function(o){ return o.orders; }).concat([1]));
      var chart = r.orders.map(function(o){
        return '<div class="col"><div class="v">' + o.orders + '</div><div class="b" style="height:' + Math.max(3, Math.round(o.orders/maxOrd*64)) + 'px"></div><div class="m">' + esc(o.date.slice(2)) + "</div></div>";
      }).join("");
      var feeAbs = (r.info.price !== null && r.info.referralRatio !== null) ? r.info.price * r.info.referralRatio : null;
      zone.innerHTML =
      '<section class="card">' +
        '<div class="verdict"><div class="gauge"><div class="num">' + s.total + '</div><div class="of">上架确定性 · 满分 100</div></div>' +
        '<div><span class="vtag ' + s.verdict.cls + '">' + s.verdict.t + '</span><p class="vdesc">' + verdictDesc(s.verdict) + "</p>" +
        '<p class="meta">' + esc(r.asin) + " · " + esc(r.country) + " 站 · 拉取于 " + esc(r.fetchedAt) +
        (r.quota ? " · 账户本月剩余 " + fmt(r.quota.monthlyRemain) + " Credit" : "") + "</p></div></div>" +
        '<div class="dims">' + dimHtml + "</div>" +
        "<details><summary>看每个维度的打分依据</summary>" + scoreDetail + "</details>" +
      "</section>" +
      '<div class="grid2">' +
        '<section class="card"><h2>产品信息</h2>' +
          "<p style='margin:0 0 8px;font-weight:600'>" + esc(r.info.title) + "</p>" +
          '<dl class="kv">' +
          "<dt>品牌</dt><dd>" + esc(r.info.brand || "—") + "</dd>" +
          "<dt>售价</dt><dd>" + money(r.info.price, r.info.currency) + "</dd>" +
          "<dt>评分 / 评论</dt><dd>" + (r.info.stars || "—") + " · " + fmt(r.info.ratings) + " 条</dd>" +
          "<dt>类目</dt><dd>" + esc(r.info.category || "—") + "</dd>" +
          "<dt>配送</dt><dd>" + esc(r.info.fulfillment || "—") + "</dd>" +
          "<dt>FBA 费</dt><dd>" + money(r.info.fbaFee, r.info.currency) + "</dd>" +
          "<dt>佣金</dt><dd>" + pct(r.info.referralRatio,0) + "（约 " + money(feeAbs, r.info.currency) + "）</dd>" +
          "<dt>上架日期</dt><dd>" + esc(r.info.streetDate || "—") + "</dd>" +
          "</dl>" +
          (r.info.url ? '<p class="meta" style="margin-top:8px"><a href="' + esc(r.info.url) + '" target="_blank" rel="noopener">在 Amazon 查看这个产品</a></p>' : "") +
        "</section>" +
        '<section class="card"><h2>近 7 天流量</h2>' +
          '<dl class="kv">' +
          "<dt>总流量</dt><dd>" + fmt(r.traffic.total) + "</dd>" +
          "<dt>自然流量</dt><dd>" + fmt(r.traffic.organic) + "（" + pct(r.traffic.organicRatio,1) + "）</dd>" +
          "<dt>广告流量</dt><dd>" + fmt(r.traffic.ad) + "</dd>" +
          "<dt>环比（上 7 天 " + fmt(r.traffic.prevTotal) + "）</dt><dd>" + (r.traffic.growth===null?"—":((r.traffic.growth>=0?"+":"") + pct(r.traffic.growth,1))) + "</dd>" +
          "<dt>自然 / 广告关键词数</dt><dd>" + fmt(r.traffic.organicTerms) + " / " + fmt(r.traffic.adTerms) + "</dd>" +
          "</dl>" +
          (r.mainKw ? '<h3 style="margin-top:14px">主关键词：' + esc(r.mainKw.term) + (r.mainKw.zh ? ' <span class="zh">' + esc(r.mainKw.zh) + "</span>" : "") + "</h3>" +
          '<dl class="kv">' +
          "<dt>周搜索量</dt><dd>" + fmt(r.mainKw.volume) + "</dd>" +

          "</dl>" : '<p class="meta">近 7 天没有反查到流量关键词。</p>') +
        "</section>" +
      "</div>" +
      '<div class="grid2">' +
        '<section class="card"><h2>支持信号</h2>' + (s.signals.length ? '<ul class="sig">' + s.signals.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : '<p class="meta">没有达到阈值的支持信号。</p>') + "</section>" +
        '<section class="card"><h2>风险提示</h2>' + (s.risks.length ? '<ul class="risk">' + s.risks.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : '<p class="meta">没有触发风险阈值。</p>') + "</section>" +
      "</div>" +
      '<section class="card"><h2>近 6 个月订单趋势（西柚分档估算）</h2><div class="chart">' + chart + "</div></section>" +
      '<div class="grid2">' +
        '<section class="card"><h2>反查关键词 Top ' + r.keywords.length + "（近 7 天，共 " + fmt(r.kwTotal) + " 个）</h2>" +
          (kwRows ? '<div class="tblwrap"><table><thead><tr><th>关键词</th><th class="num">流量</th><th class="num">自然排名</th><th class="num">广告排名</th></tr></thead><tbody>' + kwRows + "</tbody></table></div>" : '<p class="meta">无数据。</p>') +
        "</section>" +
        '<section class="card"><h2>主关键词下竞品（近 7 天）</h2>' +
          (compRows ? '<div class="tblwrap"><table><thead><tr><th>ASIN</th><th class="num">售价</th><th class="num">评分</th><th class="num">评论</th><th class="num">30天销量</th><th class="num">自然排名</th></tr></thead><tbody>' + compRows + "</tbody></table></div>" : '<p class="meta">无数据。</p>') +
        "</section>" +
      "</div>";
    }
    function renderHistory(){
      var h = $("hist");
      var cb = $("clearHist"); if (cb) cb.disabled = !reports.length;
      if (!reports.length){ h.innerHTML = '<p class="meta">还没有分析记录。</p>'; return; }
      h.innerHTML = reports.map(function(r){
        var s = scoreReport(r);
        return '<div class="hrow"><div class="grow"><b style="font-family:var(--mono)">' + esc(r.asin) + "</b> · " + esc(r.country) + " 站" +
          '<div class="meta">' + esc(r.info.title || "") + " · " + esc(r.fetchedAt) + "</div></div>" +
          '<span class="score">' + s.total + '</span><span class="pill ' + s.verdict.cls + '">' + s.verdict.t + "</span>" +
          '<button class="btn small ghost" data-view="' + r.id + '" type="button">查看</button>' +
          '<button class="btn small danger" data-del="' + r.id + '" type="button">删除</button></div>';
      }).join("");
      h.querySelectorAll("[data-view]").forEach(function(b){ b.addEventListener("click", function(){
        var r = reports.filter(function(x){ return x.id === b.getAttribute("data-view"); })[0];
        if (r){ currentId = r.id; saveReports(); renderReport(r); window.scrollTo({ top: $("reportZone").offsetTop - 10, behavior:"smooth" }); }
      }); });
      h.querySelectorAll("[data-del]").forEach(function(b){ b.addEventListener("click", function(){
        var id = b.getAttribute("data-del");
        reports = reports.filter(function(x){ return x.id !== id; });
        if (currentId === id){ currentId = reports.length ? reports[0].id : null; if (reports.length) renderReport(reports[0]); else $("reportZone").innerHTML = ""; }
        saveReports();
        renderHistory();
      }); });
    }
    $("clearHist").addEventListener("click", function(){
      reports = []; currentId = null; $("reportZone").innerHTML = ""; clearSavedReports(); renderHistory();
    });

    /* ---------- 初始化 ---------- */
    var savedRaw = loadTokenRaw();
    var saved = loadToken(); if (saved) $("token").value = saved;
    if (saved && savedRaw !== saved) storeToken(saved);
    renderTokFingerprint();
    reports = loadReports();
    currentId = loadCurrentId();
    if (reports.length){
      var cur = reports.filter(function(x){ return x.id === currentId; })[0] || reports[0];
      currentId = cur.id;
      renderHistory();
      renderReport(cur);
    } else {
      currentId = null;
      renderHistory();
    }
    </script>
  </body>
</html>
